[project]
name = "postgres-safe-mcp"
version = "0.1.0"
description = "A PostgreSQL MCP server with automatic PII detection and obfuscation"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.26.0",
    "psycopg[binary]>=3.1",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
